        const SEOSimulator = () => {

                <i className="fa-solid fa-globe w-5 h-5 text-slate-700 flex items-center justify-center"></i>

              <p className="text-sm text-slate-600 mb-6 pt-2">This illustrates the visual difference between Paid Search (Ads) and Organic Search (SEO).</p>

                <i className="fa-solid fa-magnifying-glass w-5 h-5 text-slate-500 flex items-center justify-center"></i>

              <div className="mb-8 pb-8 border-b border-slate-200">

                <i className="fa-solid fa-code w-5 h-5 text-slate-700 flex items-center justify-center"></i>

              </h4>
              <p className="text-sm text-slate-600 mb-6 pt-2">Hover over the blocks below to visualize how search engines read your page structure (HTML Tags) compared to how human visitors see the text.</p>
              
              <div className="space-y-4 font-sans border-l-4 border-slate-300 pl-4 relative md:ml-8">
                {/* H1 Block */}
                <div className="group relative border-2 border-transparent hover:border-slate-800 p-3 rounded-lg transition-colors cursor-crosshair bg-white shadow-sm">

                    <strong>Rule:</strong> Only ONE H1 per page. This acts as the main title and tells Google exactly what the page is about.
                  </div>

                {/* Paragraph Block */}

                    &lt;p&gt;
                  </div>
                  <p className="text-sm text-slate-700">Digital marketing is essential for modern business growth. In this guide, we will explore the best strategies...</p>
                  <div className="hidden group-hover:block text-xs text-slate-500 font-mono mt-2 bg-slate-100 p-2 rounded border border-slate-200">
                    <strong>Content:</strong> Standard paragraph text. Should include secondary keywords naturally so search engines have context.
                  </div>
                </div>

                {/* H2 Block */}
                <div className="group relative border-2 border-transparent hover:border-slate-700 p-3 rounded-lg transition-colors cursor-crosshair bg-white shadow-sm">
                  <div className="absolute -left-12 md:-left-16 top-4 bg-slate-700 text-white text-xs font-bold px-2 py-1 rounded opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                    &lt;H2&gt;
                  </div>
                  <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-2">1. Understanding Search Engine Optimization</h2>
                  <div className="hidden group-hover:block text-xs text-slate-500 font-mono mt-2 bg-slate-100 p-2 rounded border border-slate-200">

                  </div>

                    <strong>Rule:</strong> Use H3s for sub-topics under an H2. Maintains hierarchical logic so Google's web crawlers don't get confused.
                  </div>

              </div>

          return (

                </div>
                <div>
                  <label className="block text-xs font-extrabold text-slate-600 uppercase mb-1 tracking-wider">2. Body (Provides context)</label>

                </div>
                <div>
                  <label className="block text-xs font-extrabold text-slate-600 uppercase mb-1 tracking-wider">3. Call To Action (CTA)</label>
                  <input type="text" value={cta} onChange={e=>setCta(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-shadow" />
                </div>
                <div>

                  <input type="text" value={hashtags} onChange={e=>setHashtags(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 font-mono focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-shadow" />
                </div>
              </div>
              
              {/* Smartphone Preview */}
              <div className="w-full md:w-72 bg-white text-slate-900 rounded-[2.5rem] border-[10px] border-slate-900 overflow-hidden shadow-2xl flex flex-col relative">
                <div className="absolute top-0 inset-x-0 h-5 bg-slate-900 rounded-b-2xl w-36 mx-auto z-10"></div>
                <div className="h-56 bg-slate-100 flex flex-col items-center justify-center border-b border-slate-200 relative overflow-hidden">
                   <div className="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-400 via-transparent to-transparent"></div>
                  <span className="text-slate-500 text-sm font-extrabold tracking-widest uppercase relative z-10">[ Visual Art ]</span>
                </div>
                <div className="p-5 flex-1 overflow-y-auto text-[13px] custom-scrollbar">

                </div>

            </div>
          );

        const SEMrushSimulator = () => {
          const [query, setQuery] = useState('');
          const [results, setResults] = useState(null);

          const mockDb = {
            'social media': [
              { keyword: 'social media management', vol: '14,000', kd: 45, intent: 'Commercial' },
              { keyword: 'social media manager vs virtual assistant', vol: '1,200', kd: 22, intent: 'Informational' },
              { keyword: 'social media tools', vol: '8,100', kd: 55, intent: 'Transactional' },
            ],
            'virtual assistant': [
              { keyword: 'virtual assistant services', vol: '22,000', kd: 60, intent: 'Commercial' },
              { keyword: 'how to become a virtual assistant', vol: '18,000', kd: 40, intent: 'Informational' },
              { keyword: 'digital marketing virtual assistant', vol: '3,600', kd: 35, intent: 'Commercial' },
            ]
          };

          const handleSearch = () => {
            const key = query.toLowerCase();
            if (key.includes('social')) setResults(mockDb['social media']);
            else if (key.includes('virtual')) setResults(mockDb['virtual assistant']);
            else setResults([{ keyword: `${query} for beginners`, vol: '450', kd: 15, intent: 'Informational' }]);
          };

          return (
            <div className="bg-white border border-slate-300 shadow-sm rounded-xl p-6 my-6">
              <div className="flex items-center gap-3 mb-6 border-b border-slate-200 pb-4">
                <div className="bg-slate-900 p-2.5 rounded-lg">
                    <i className="fa-solid fa-magnifying-glass w-5 h-5 text-white flex items-center justify-center"></i>
                </div>
                <h4 className="text-lg font-bold text-slate-900">SEMrush Mock Keyword Tool</h4>
              </div>
              
              <div className="flex gap-2 mb-6">
                <input 
                  type="text" 
                  placeholder="Try 'social media' or 'virtual assistant'..."
                  className="flex-1 border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-shadow bg-slate-50"
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                />
                <button onClick={handleSearch} className="bg-slate-900 hover:bg-black text-white px-6 py-2.5 rounded-lg text-sm font-bold transition-colors shadow-sm">

                  <table className="w-full text-sm text-left">
                    <thead className="bg-slate-100 text-slate-700 text-xs uppercase tracking-wider">
                      <tr>
                        <th className="px-5 py-4 font-extrabold">Keyword</th>
                        <th className="px-5 py-4 font-extrabold">Intent</th>
                        <th className="px-5 py-4 font-extrabold">Volume (Mo.)</th>
                        <th className="px-5 py-4 font-extrabold">KD % (Difficulty)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 bg-white">
                      {results.map((res, idx) => (
                        <tr key={idx} className="hover:bg-slate-50 transition-colors">

          const initQuiz = () => {
            const shuffled = questions.map(q => {
              const correctText = q.o[q.a]; // Store the exact string of the correct answer
              const shuffledOptions = [...q.o].sort(() => Math.random() - 0.5);
              return { ...q, o: shuffledOptions, correctText };
            }).sort(() => Math.random() - 0.5); // Shuffle the order of questions
            
            setShuffledQuestions(shuffled);
            setAnswers({});
            setSubmitted(false);
            setScore(0);
          };

          useEffect(() => {
            initQuiz();
          }, [moduleId]);

          const handleOptionChange = (qIndex, optText) => {
            if (submitted && isPassed) return;
            setAnswers({...answers, [qIndex]: optText});
          };

          const handleSubmit = () => {
            let correct = 0;
            shuffledQuestions.forEach((q, i) => {
              if(answers[i] === q.correctText) correct++;

            setSubmitted(true);

                   <i className="fa-solid fa-book-open"></i> Back to Material

                     <button onClick={initQuiz} className="px-8 py-3 bg-slate-900 text-white font-bold rounded-lg hover:bg-black transition-colors shadow-md">
                       <i className="fa-solid fa-rotate-right mr-2"></i> Retake Quiz

                     <button onClick={onCancel} className="px-8 py-3 bg-slate-200 text-slate-900 font-bold rounded-lg hover:bg-slate-300 transition-colors shadow-md">

                   </div>

                   <div className="space-y-6">

                        <div key={i} className="bg-white p-6 rounded-xl border border-slate-200 shadow-md hover:shadow-lg transition-shadow relative overflow-hidden">

                                 <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${answers[i] === opt ? 'border-white' : 'border-slate-400 bg-white'}`}>

                                 </div>

                               </label>
                            ))}
                          </div>
                        </div>

              { q: "What does SEMrush allow you to do to competitors?", o: ["Spy on them and see their traffic/keywords", "Delete their website", "Hack their emails", "Call their clients"], a: 0 },
              { q: "What is the Keyword Magic Tool used for?", o: ["Making logos", "Finding long-tail keywords", "Sending SMS", "Auditing site speed"], a: 1 },
              { q: "Why are long-tail keywords valuable?", o: ["They have higher search volume", "They are shorter", "They have lower search volume but much higher intent to purchase", "They are free"], a: 2 },
              { q: "What does KD stand for?", o: ["Keyword Data", "Keyword Difficulty", "Knowledge Domain", "Key Demographics"], a: 1 },
              { q: "If a client's website is brand new, what KD should a VA filter out?", o: ["Keywords with KD under 10", "Keywords with KD over 30 (too competitive)", "Keywords with KD equal to 0", "All keywords"], a: 1 },
              { q: "What does the Site Audit tool do?", o: ["Crawls the website and provides a list of errors", "Writes blog posts", "Generates images", "Posts to Twitter"], a: 0 },
              { q: "What is an example of an error found in a Site Audit?", o: ["A bad logo", "Broken links and slow pages", "A boring caption", "A low engagement rate"], a: 1 },
              { q: "Can SEMrush show you the exact Google Ads a competitor is running?", o: ["Yes", "No", "Only if you ask them", "Only on Sundays"], a: 0 },
              { q: "Does knowing SEMrush make a VA highly valuable?", o: ["No, it's outdated", "Yes, it's an enterprise-level platform", "Only for graphic design", "Only for email marketing"], a: 1 }
            ]
          },
          {
            id: 17, title: "Sample Caption Frameworks", icon: "fa-file-lines",
            content: [
              { subtitle: "17.1 Educational Framework (Value First)", list: [
                "Hook: The biggest lie you've been told about SEO.",
                "Body: Everyone says you need more backlinks. But if your on-page structure is broken, sending traffic to it is like pouring water into a search engine. Focus on your H1s, internal linking, and load speed first.",
                "CTA: Save this post to use as an audit checklist for your own website.",
                "Hashtags: #SEOTips #WebsiteAudit #VirtualAssistant"
              ]},
              { subtitle: "17.2 Promotional Framework (Problem/Agitate/Solution)", list: [
                "Hook: Are you spending 10 hours a week just answering emails?",
                "Body: (Agitate) That is 40 hours a month you aren't spending on growing your business. It leads to burnout and missed opportunities. (Solution) Our certified VAs can take over your inbox, automate your CRM, and buy your time back.",
                "CTA: Click the link in our bio to book a free discovery call and see how much time we can save you."
              ]},
              { subtitle: "17.3 Engagement Framework (Community Building)", list: [
                "Hook: Unpopular opinion: TikTok is better for B2B than LinkedIn.",
                "Body: We have seen massive shifts in where business owners consume content. The raw authenticity of video is converting faster than polished corporate posts.",
                "CTA: Do you agree or disagree? Let's debate in the comments below."
              ]}
            ],
            quiz: [
              { q: "What is the primary goal of the Educational Framework?", o: ["To ask for a sale immediately", "To provide Value First", "To trigger an argument", "To use no hashtags"], a: 1 },
              { q: "In the Educational example, what does the Hook do?", o: ["Makes a bold claim ('The biggest lie...')", "Asks for money", "Says hello", "Lists hashtags"], a: 0 },
              { q: "What is the CTA in the Educational example?", o: ["Buy my course", "Save this post to use as an audit checklist", "Call me now", "Don't click this"], a: 1 },
              { q: "What does the PAS formula stand for in the Promotional Framework?", o: ["Post/Always/Sell", "Problem/Agitate/Solution", "Primary/Action/Strategy", "Public/Awareness/System"], a: 1 },
              { q: "In the Promotional example, what is the 'Problem'?", o: ["Spending 10 hours a week answering emails", "Having too much money", "A broken website", "A bad logo"], a: 0 },
              { q: "In the Promotional example, what is the 'Agitate' phase?", o: ["Offering the VA service", "Stating it leads to burnout and missed opportunities", "Asking them to comment", "Using emojis"], a: 1 },
              { q: "In the Promotional example, what is the 'Solution'?", o: ["Certified VAs taking over the inbox", "Working harder", "Deleting the email account", "Buying a new laptop"], a: 0 },
              { q: "What is the primary goal of the Engagement Framework?", o: ["To sell a product", "Community Building / Starting a conversation", "To teach SEO", "To hide content"], a: 1 },
              { q: "In the Engagement example, what kind of Hook is used?", o: ["A boring fact", "An 'Unpopular opinion' to spark debate", "A discount code", "A greeting"], a: 1 },
              { q: "In the Engagement example, what is the CTA?", o: ["Click link in bio", "Do you agree or disagree? Let's debate in the comments", "Save this for later", "Send me a DM"], a: 1 }
            ]
          },
          {
            id: 18, title: "Course Outcomes & Next Steps", icon: "fa-circle-check",
            content: [
              { subtitle: "Comprehensive Learner Outcomes", text: "By completing this intensive training, you have transitioned from a general administrative assistant into a specialized Digital Marketing Virtual Assistant. You are now equipped to:", list: [
                "Architect and execute multi-platform social media strategies that drive real engagement.",
                "Engineer high-converting prompts for AI tools like ChatGPT and Gemini to scale content production.",
                "Build, manage, and optimize complex CRM pipelines in GoHighLevel.",
                "Automate business operations using Webhooks and Zapier.",
                "Analyze complex data metrics (CAC, ROAS, CTR) and translate them into actionable business advice for clients."
              ]},
              { subtitle: "Next Steps for Career Growth", list: [
                "Build a Portfolio: Create mock campaigns, graphics, and email sequences to prove your skills.",
                "Master Cold Outreach: Use your new copywriting skills to pitch local businesses on how you can improve their SEO or manage their CRM.",
                "Continuous Learning: Digital marketing changes weekly. Stay updated on algorithm shifts and new AI tools."
              ]}
            ],
            quiz: [
              { q: "What is the first recommended Next Step for Career Growth?", o: ["Wait for clients to find you", "Build a Portfolio with mock campaigns", "Quit your job immediately", "Buy a more expensive computer"], a: 1 },
              { q: "Why should you create mock campaigns and graphics?", o: ["Because it's fun", "To prove your skills to potential clients without needing prior client experience", "To waste time", "To post on your personal Facebook"], a: 1 },
              { q: "What is Cold Outreach?", o: ["Pitching local businesses your services using your copywriting skills", "Standing in the snow", "Ignoring emails", "Calling your friends"], a: 0 },
              { q: "What should you pitch to local businesses?", o: ["How you can improve their SEO or manage their CRM", "That you need a job", "That their logo is ugly", "Nothing"], a: 0 },
              { q: "Why is Continuous Learning necessary in Digital Marketing?", o: ["It isn't", "Because the industry, algorithms, and AI tools change weekly", "Because clients require college degrees", "To memorize the dictionary"], a: 1 },
              { q: "As a specialized VA, you can now analyze complex metrics like CAC and ROAS. What do you do with this?", o: ["Keep it secret", "Translate them into actionable business advice for clients", "Delete the data", "Change the numbers to look good"], a: 1 },
              { q: "What tool were you trained to use for CRM pipelines?", o: ["Photoshop", "GoHighLevel", "Canva", "Excel"], a: 1 },
              { q: "What tools were you trained to use for Automations?", o: ["Webhooks and Zapier", "H1 and H2 tags", "Instagram and TikTok", "Mailchimp and ConvertKit"], a: 0 },
              { q: "What tools were you trained to use for AI Prompt Engineering?", o: ["Zapier", "ChatGPT and Gemini", "Wix", "Shopify"], a: 1 },
              { q: "You have transitioned from a general administrative assistant into a what?", o: ["Software Engineer", "Specialized Digital Marketing Virtual Assistant", "CEO", "Graphic Designer"], a: 1 }
            ]
          }
        ];

        function App() {
          const [activeModuleId, setActiveModuleId] = useState(1);
          const [sidebarOpen, setSidebarOpen] = useState(false);
          const [unlockedModules, setUnlockedModules] = useState([1]); // Only module 1 unlocked by default
          const [isQuizMode, setIsQuizMode] = useState(false);

          const activeModule = COURSE_DATA.find(m => m.id === activeModuleId);
          const progress = (unlockedModules.length / COURSE_DATA.length) * 100;
          const isCurrentModulePassed = unlockedModules.includes(activeModuleId + 1) || (activeModuleId === COURSE_DATA.length && unlockedModules.includes('completed'));

          const handleModulePass = () => {
            if (activeModuleId === COURSE_DATA.length) {
              if (!unlockedModules.includes('completed')) {
                setUnlockedModules([...unlockedModules, 'completed']);
              }
            } else {
              if (!unlockedModules.includes(activeModuleId + 1)) {
                setUnlockedModules([...unlockedModules, activeModuleId + 1]);
              }
            }
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          };

          return (
            <div className="flex h-screen bg-slate-50 font-sans text-slate-900 overflow-hidden selection:bg-slate-200 selection:text-slate-900">
              
              {/* Mobile Sidebar Overlay */}
              {sidebarOpen && (
                <div className="fixed inset-0 bg-slate-900/40 z-20 md:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div>
              )}

              {/* Sidebar Navigation */}
              <aside className={`fixed md:static inset-y-0 left-0 w-80 bg-white border-r border-slate-200 text-slate-800 transform transition-transform duration-300 ease-in-out z-30 flex flex-col shadow-2xl md:shadow-none ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                
                {/* Monochromatic Header */}
                <div className="p-6 bg-slate-900 flex flex-col border-b border-slate-800 relative overflow-hidden">
                  <div className="flex justify-between items-center mt-2">
                    <div>
                      <h1 className="text-xl font-black leading-tight tracking-tight text-white flex items-center gap-2">
                        <i className="fa-solid fa-table-columns w-5 h-5 text-slate-300"></i> Digital Marketing
                      </h1>
                      <p className="text-[10px] text-slate-400 font-bold tracking-widest uppercase mt-1">For Virtual Assistants</p>
                    </div>
                    <button className="md:hidden text-slate-400 hover:text-white" onClick={() => setSidebarOpen(false)}>
                      <i className="fa-solid fa-xmark w-6 h-6"></i>
                    </button>
                  </div>
                </div>
                
                <div className="flex-1 overflow-y-auto py-6 custom-scrollbar bg-slate-50">
                  <div className="px-6 mb-6">
                    <div className="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">
                      <span>Course Unlocked</span>
                      <span className="text-slate-800">{Math.round(progress)}%</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden shadow-inner">
                      <div className="h-2.5 rounded-full transition-all duration-700 bg-slate-800" style={{ width: `${progress}%` }}></div>
                    </div>
                  </div>

                  <ul className="space-y-1.5 px-4">
                    {COURSE_DATA.map((mod) => {
                      const isActive = activeModuleId === mod.id;
                      const isUnlocked = unlockedModules.includes(mod.id);
                      
                      return (
                        <li key={mod.id}>
                          <button
                            onClick={() => { if(isUnlocked) { setActiveModuleId(mod.id); setIsQuizMode(false); setSidebarOpen(false); document.getElementById('main-scroll-area').scrollTo(0,0); } }}
                            disabled={!isUnlocked}
                            className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-200 text-left border 
                              ${isActive ? 'bg-white text-slate-900 font-bold border-slate-200 shadow-sm border-l-4 border-l-slate-900' : 
                                isUnlocked ? 'bg-transparent text-slate-600 border-transparent hover:bg-slate-200 hover:text-slate-900 font-semibold cursor-pointer' : 
                                'bg-slate-100 text-slate-400 border-slate-100 cursor-not-allowed opacity-60'}`}
                          >
                            <div className="flex items-center gap-3">
                              <i className={`fa-solid ${mod.icon} w-5 h-5 flex-shrink-0 ${isActive ? 'text-slate-900' : isUnlocked ? 'text-slate-500' : 'text-slate-300'}`}></i>
                              <span className="text-sm leading-tight line-clamp-2">
                                <span className={`opacity-70 mr-1.5 ${isActive ? 'text-slate-900' : ''}`}>{mod.id}.</span> 
                                {mod.title}
                              </span>
                            </div>
                            {!isUnlocked && <i className="fa-solid fa-lock text-slate-300 text-xs"></i>}
                          </button>
                        </li>
                      );
                    })}
                  </ul>
                </div>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 flex flex-col h-full bg-white relative overflow-hidden z-10">
                
                {/* Top Header */}
                <header className="flex items-center gap-4 p-5 md:p-8 border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-20">
                  <button className="md:hidden p-2.5 rounded-lg bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100" onClick={() => setSidebarOpen(true)}>
                    <i className="fa-solid fa-bars w-5 h-5"></i>
                  </button>
                  <div>
                    <span className="text-xs font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Module {activeModule.id}</span>
                    <h2 className="text-2xl md:text-4xl font-extrabold text-slate-900 tracking-tight">{activeModule.title}</h2>
                  </div>
                </header>

                {/* Content Scroll Area */}
                <div className="flex-1 overflow-y-auto p-5 md:p-10 custom-scrollbar pb-32 bg-white scroll-smooth" id="main-scroll-area">
                  <div className="max-w-4xl mx-auto space-y-12">
                    
                    {!isQuizMode ? (
                      <>
                        {activeModule.content.map((section, idx) => (
                          <div key={idx} className="space-y-5 relative">
                            
                            {/* Render Text Content */}
                            {section.subtitle && (
                              <h3 className="text-xl md:text-2xl font-extrabold text-slate-800 border-b-2 border-slate-100 pb-3 inline-block">
                                {section.subtitle}
                              </h3>
                            )}
                            
                            {section.text && (
                              <p 
                                className="text-slate-700 leading-relaxed text-base font-medium"
                                dangerouslySetInnerHTML={{__html: section.text}}
                              />
                            )}
                            
                            {section.list && (
                              <ul className="space-y-3.5 mt-4">
                                {section.list.map((item, i) => (
                                  <li key={i} className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-800 text-base font-medium shadow-sm hover:shadow-md transition-shadow">
                                    <i className="fa-solid fa-chevron-right w-5 h-5 text-slate-900 flex-shrink-0 mt-0.5"></i>
                                    <span dangerouslySetInnerHTML={{__html: item.replace(/^([^:]+):/, '<strong class="font-black text-slate-900">$1:</strong>')}} />
                                  </li>
                                ))}
                              </ul>
                            )}

                            {/* Render Interactive Element embedded within the loop if passed here */}
                            {section.interactive && (
                              <div className="mt-6">
                                {section.interactive}
                              </div>
                            )}

                            {/* Render Video Iframe */}
                            {section.video && (
                              <div className="my-8 rounded-2xl overflow-hidden border border-slate-300 shadow-sm bg-slate-100 aspect-video relative">
                                 <iframe 
                                    src={section.video.split('?')[0]} 
                                    title={`Video for ${activeModule.title}`} 
                                    className="absolute inset-0 w-full h-full"
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    referrerPolicy="strict-origin-when-cross-origin"
                                    allowFullScreen>
                                 </iframe>
                              </div>
                            )}

                          </div>
                        ))}

                        {/* Render Module-Level Interactive Element if it exists */}
                        {activeModule.interactive && !activeModule.content.some(c => c.interactive) && (
                          <div className="mt-12 pt-8 border-t border-slate-200">
                            {activeModule.interactive}
                          </div>
                        )}

                        {/* Strict Module Quiz Section */}
                        {activeModule.quiz && (
                          <div className="mt-12 pt-8 border-t border-slate-200">
                            {isCurrentModulePassed ? (
                              <div className="bg-slate-100 p-6 rounded-xl border-l-4 border-slate-900 shadow-sm">
                                <h3 className="text-slate-900 font-extrabold text-xl flex items-center gap-2">
                                  <i className="fa-solid fa-circle-check text-slate-800"></i> Module Passed!
                                </h3>
                                <p className="text-slate-700 mt-2 font-medium">You have successfully passed the quiz for this module.</p>
                              </div>
                            ) : (
                              <div className="text-center bg-slate-50 border border-slate-200 p-8 rounded-2xl shadow-sm">
                                <h3 className="text-2xl font-extrabold text-slate-900 mb-2">Ready to test your knowledge?</h3>
                                <p className="text-slate-600 font-medium mb-6">You must score 90% or higher to unlock the next module. Course materials will be hidden while taking the quiz.</p>
                                <button onClick={() => { setIsQuizMode(true); document.getElementById('main-scroll-area').scrollTo(0,0); }} className="px-8 py-4 bg-slate-900 text-white font-extrabold text-lg rounded-xl hover:bg-black transition-all shadow-md">
                                  <i className="fa-solid fa-play mr-2"></i> Start Module {activeModule.id} Quiz
                                </button>
                              </div>
                            )}
                          </div>
                        )}

                        {/* Navigation Buttons */}
                        <div className="flex justify-between items-center pt-12 mt-16 border-t border-slate-200">
                          <button 
                            onClick={() => {
                              setActiveModuleId(Math.max(1, activeModuleId - 1));
                              setIsQuizMode(false);
                              document.getElementById('main-scroll-area').scrollTo(0,0);
                            }}
                            disabled={activeModuleId === 1}
                            className="px-6 py-3 rounded-xl border-2 border-slate-300 text-slate-700 font-bold disabled:opacity-30 disabled:cursor-not-allowed hover:border-slate-900 hover:text-slate-900 transition-colors text-sm"
                          >
                            Previous Module
                          </button>

                          {isCurrentModulePassed ? (
                            <button 
                              onClick={() => {
                                setActiveModuleId(Math.min(COURSE_DATA.length, activeModuleId + 1));
                                setIsQuizMode(false);
                                document.getElementById('main-scroll-area').scrollTo(0,0);
                              }}
                              disabled={activeModuleId === COURSE_DATA.length}
                              className="px-6 py-3 rounded-xl bg-slate-900 text-white font-bold disabled:opacity-30 disabled:cursor-not-allowed hover:bg-black transition-colors flex items-center gap-2 text-sm shadow-md"
                            >
                              {activeModuleId === COURSE_DATA.length ? 'Course Completed' : 'Next Module'} <i className="fa-solid fa-play w-4 h-4"></i>
                            </button>
                          ) : (
                            <div className="px-6 py-3 rounded-xl bg-slate-100 text-slate-400 font-bold border border-slate-200 flex items-center gap-2 text-sm cursor-not-allowed">
                              <i className="fa-solid fa-lock"></i> Pass Quiz to Unlock Next
                            </div>
                          )}
                        </div>
                      </>
                    ) : (
                      <QuizSection 
                        questions={activeModule.quiz} 
                        moduleId={activeModule.id} 
                        onPass={() => {
                          handleModulePass();
                          setIsQuizMode(false);
                        }} 
                        isPassed={isCurrentModulePassed}
                        onCancel={() => {
                          setIsQuizMode(false);
                          document.getElementById('main-scroll-area').scrollTo(0,0);
                        }}
                      />
                    )}

                  </div>
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
